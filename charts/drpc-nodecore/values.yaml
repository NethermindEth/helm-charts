############################################
# drpc-nodecore Multi-Project Chart
############################################

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# NodeCore container image
image:
  repository: drpcorg/nodecore
  pullPolicy: IfNotPresent
  tag: "1.14.0"

# Image used for the envsubst init container
initImage:
  repository: bhgedigital/envsubst
  tag: v1.0-alpine3.6

# Secrets for pulling images from a private registry
imagePullSecrets: []

# ──────────────────────────────────────────
# Shared defaults (inherited by all projects unless overridden)
# ──────────────────────────────────────────
defaults:
  replicaCount: 1

  deployment:
    enabled: true
    strategy: {}
    restartOnChanges: true
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      # targetMemoryUtilizationPercentage: 80

  resources: {}
    # requests:
    #   memory: 1Gi
    #   cpu: "1"
    # limits:
    #   memory: 2Gi
    #   cpu: "2"

  readinessProbe:
    httpGet:
      path: /metrics
      port: 9093
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 2
    successThreshold: 1

  livenessProbe:
    tcpSocket:
      port: 9090
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault

  initContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsGroup: 0
    runAsNonRoot: false
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault

  serviceMonitor:
    enabled: true
    interval: 30s
    # namespace: ""
    # labels: {}
    # annotations: {}
    # scrapeTimeout: ""
    # relabelings: []
    # metricRelabelings: []

  terminationGracePeriodSeconds: 30

  # ──────────────────────────────────────────
  # Cache (optional, shared by all projects unless overridden)
  # ──────────────────────────────────────────
  # Credentials can use ${VAR} placeholders, expanded by the envsubst init
  # container from the project's `secretRef`.
  # -- Shared storage backends referenced by cache connectors by name (see https://github.com/drpcorg/nodecore/blob/main/docs/nodecore/07-app-storages.md)
  appStorages: []
    # - name: shared-redis
    #   redis:
    #     address: "redis-master.redis.svc.cluster.local:6379"
    #     password: "${REDIS_PASSWORD}"
    #     db: 0

  # -- Cache connectors and policies (see https://github.com/drpcorg/nodecore/blob/main/docs/nodecore/04-cache.md)
  cache: {}
    # receive-timeout: 500ms
    # connectors:
    #   - id: redis-cache
    #     driver: redis
    #     redis:
    #       storage-name: shared-redis
    # policies:
    #   - id: finalized-blocks
    #     chain: "*"
    #     method: "eth_getBlockByNumber"
    #     connector-id: redis-cache
    #     finalization-type: finalized
    #     ttl: 30s

# ──────────────────────────────────────────
# Projects
# ──────────────────────────────────────────
# Each key is a project name (must be a valid K8s DNS label: lowercase, alphanumeric, hyphens).
# Each project produces: Deployment, Service, ConfigMap, (optional) HPA, ServiceMonitor.
#
# Secrets are managed out-of-band (InfisicalSecret CRD or ExternalSecret CRD).
# The chart references the resulting K8s Secret by name via `secretRef`.
projects: {}
  # example-project:
  #   # Optional: K8s Secret name containing auth token + provider API keys
  #   # If omitted, no auth is configured and no secret is injected.
  #   secretRef: "nodecore-example-project-secret"
  #
  #   # Env var name for the auth token (must exist in the secret)
  #   authTokenEnvVar: "NODECORE_AUTH_TOKEN"
  #
  #   # Additional env vars
  #   env: []
  #   envFrom: []
  #
  #   # Optional Service annotations
  #   # serviceAnnotations:
  #   #   example.com/annotation: "value"
  #
  #   # Override any defaults
  #   replicaCount: 2
  #   resources:
  #     requests:
  #       memory: 2Gi
  #       cpu: "2"
  #   deployment:
  #     autoscaling:
  #       enabled: true
  #       minReplicas: 2
  #       maxReplicas: 8
  #
  #   # Optional per-project cache override (replaces defaults.appStorages / defaults.cache)
  #   appStorages:
  #     - name: shared-redis
  #       redis:
  #         address: "redis-master.redis.svc.cluster.local:6379"
  #         password: "${REDIS_PASSWORD}"
  #   cache:
  #     connectors:
  #       - id: redis-cache
  #         driver: redis
  #         redis:
  #           storage-name: shared-redis
  #     policies:
