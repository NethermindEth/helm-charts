suite: statefulset tests

release:
  name: some-release

set:
  nameOverride: some-name

templates:
  - statefulset.yaml

tests:
  - it: given explicit affinity then use that affinity and ignore anti affinity presets
    set:
      antiAffinityPreset: hard
      affinity:
        nodeAffinity: potato
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity: potato

  - it: given soft anti affinity preset then use preferred pod anti affinity
    set:
      antiAffinityPreset: soft
      affinity: {}
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: some-name
                        app.kubernetes.io/instance: some-release

  - it: given hard anti affinity preset then use required pod anti affinity
    set:
      antiAffinityPreset: hard
      affinity: {}
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                        app.kubernetes.io/name: some-name
                        app.kubernetes.io/instance: some-release

  - it: given no affinity and no preset then affinity is not configured
    asserts:
      - isEmpty:
          path: spec.template.spec.affinity

  - it: given topology spread constraints without labelSelector then auto-inject pod selector labels
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: some-name
                  app.kubernetes.io/instance: some-release

  - it: given topology spread constraints with explicit labelSelector then use it as-is
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              custom-label: custom-value
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  custom-label: custom-value

  - it: given no topology spread constraints then they are not configured
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: given init containers then only those without resources get the default init container resources
    set:
      initContainerResources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 32Mi
      initContainers:
        - name: no-resources
          image: busybox
        - name: own-resources
          image: busybox
          resources:
            requests:
              cpu: 500m
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources
          value:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      - equal:
          path: spec.template.spec.initContainers[1].resources
          value:
            requests:
              cpu: 500m
