suite: cluster tests

templates:
  - cluster.yaml

tests:
  - it: given no name override then name defaults to the fullname
    release:
      name: foo
    set:
      cluster:
        metadata:
          name: ""
    asserts:
      - equal:
          path: metadata.name
          value: foo-cnpg-cluster

  - it: given a cluster metadata name then it overrides the generated name
    set:
      cluster:
        metadata:
          name: pg
    asserts:
      - equal:
          path: metadata.name
          value: pg

  - it: given common and cluster labels then both are rendered alongside the standard labels
    set:
      commonLabels:
        team: db
      cluster:
        metadata:
          labels:
            foo: bar
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: cnpg-cluster
      - equal:
          path: metadata.labels.team
          value: db
      - equal:
          path: metadata.labels.foo
          value: bar

  - it: given a scheduled backup that uses the barman cloud plugin by default then the barman cloud plugin is added to the cluster plugins
    release:
      name: foo
    set:
      scheduledBackups:
        nightly:
          schedule: "0 0 2 * * *"
    asserts:
      - contains:
          path: spec.plugins
          any: true
          content:
            name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: foo-cnpg-cluster-backup

  - it: given a scheduled backup that explicitly uses the barman cloud plugin then the barman cloud plugin is added to the cluster plugins
    release:
      name: foo
    set:
      scheduledBackups:
        nightly:
          schedule: "0 0 2 * * *"
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
    asserts:
      - contains:
          path: spec.plugins
          any: true
          content:
            name: barman-cloud.cloudnative-pg.io
            isWALArchiver: true
            parameters:
              barmanObjectName: foo-cnpg-cluster-backup

  - it: given barman enabled but no scheduled backups then no barman cloud plugin is added
    set:
      barman:
        enabled: true
    asserts:
      - notExists:
          path: spec.plugins

  - it: given scheduled backups that do not use the barman cloud plugin then no barman cloud plugin is added
    set:
      scheduledBackups:
        snapshot:
          schedule: "0 0 2 * * *"
          method: volumeSnapshot
        other:
          schedule: "0 0 2 * * *"
          method: plugin
          pluginConfiguration:
            name: other-plugin.example.com
    asserts:
      - notExists:
          path: spec.plugins

  - it: given barman disabled and a barman scheduled backup then no barman cloud plugin is added
    set:
      barman:
        enabled: false
      scheduledBackups:
        nightly:
          schedule: "0 0 2 * * *"
    asserts:
      - notExists:
          path: spec.plugins

  - it: given a barman scheduled backup and existing plugins then the barman cloud plugin is appended
    release:
      name: foo
    set:
      scheduledBackups:
        nightly:
          schedule: "0 0 2 * * *"
      cluster:
        plugins:
          - name: my-plugin.example.com
    asserts:
      - contains:
          path: spec.plugins
          any: true
          content:
            name: my-plugin.example.com
      - contains:
          path: spec.plugins
          any: true
          content:
            name: barman-cloud.cloudnative-pg.io

  - it: given cluster values then everything except metadata is rendered as spec
    set:
      cluster:
        metadata:
          name: pg
        instances: 3
        storage:
          size: 20Gi
    asserts:
      - equal:
          path: spec.instances
          value: 3
      - equal:
          path: spec.storage.size
          value: 20Gi
      - notExists:
          path: spec.metadata
