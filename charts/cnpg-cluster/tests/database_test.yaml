suite: database tests

templates:
  - database.yaml

tests:
  - it: given no name override then name defaults to the fullname and the database name
    release:
      name: foo
    set:
      databases:
        mydb:
          owner: myuser
    asserts:
      - equal:
          path: metadata.name
          value: foo-cnpg-cluster-mydb

  - it: given a database metadata name then it overrides the generated name
    set:
      databases:
        mydb:
          metadata:
            name: pg
          owner: myuser
    asserts:
      - equal:
          path: metadata.name
          value: pg

  - it: given common and database labels then both are rendered alongside the standard labels
    set:
      commonLabels:
        team: db
      databases:
        mydb:
          metadata:
            labels:
              foo: bar
          owner: myuser
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: cnpg-cluster
      - equal:
          path: metadata.labels.team
          value: db
      - equal:
          path: metadata.labels.foo
          value: bar

  - it: given database values then everything except metadata is rendered as spec
    release:
      name: foo
    set:
      databases:
        mydb:
          owner: myuser
          ownerAccess:
            - USAGE
    asserts:
      - equal:
          path: spec.name
          value: mydb
      - equal:
          path: spec.cluster.name
          value: foo-cnpg-cluster
      - equal:
          path: spec.owner
          value: myuser
      - notExists:
          path: spec.metadata

  - it: given a cluster in the databases spec then it fails
    set:
      databases:
        foo:
          cluster:
            name: other

    asserts:
      - failedTemplate:
          errorMessage: "databases.foo.cluster must not be set, it is managed by the chart"

  - it: given a name in the databases spec then it fails
    set:
      databases:
        foo:
          name: other
    asserts:
      - failedTemplate:
          errorMessage: "databases.foo.name must not be set, it is managed by the chart"
