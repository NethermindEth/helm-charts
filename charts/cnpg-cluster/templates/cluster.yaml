apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cnpg-cluster.clusterName" . }}
  {{- $labels := include "cnpg-cluster.labels" . | fromYaml }}
  {{- $labels = merge $labels .Values.cluster.metadata.labels }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- $annotations := merge (deepCopy .Values.commonAnnotations) .Values.cluster.metadata.annotations }}
  {{- with $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- $spec := omit .Values.cluster "metadata" "plugins" }}
  {{- $plugins := list }}
  {{- with .Values.cluster.plugins }}
  {{- $plugins = . }}
  {{- end }}
  {{- if .Values.barman.enabled }}
  {{- $barmman := (dict "name" "barman-cloud.cloudnative-pg.io" "isWALArchiver" true "parameters" (dict "barmanObjectName" (include "cnpg-cluster.barmanName" .))) }}
  {{- $plugins = append $plugins $barmman }}
  {{- end }}
  {{- if $plugins }}
  {{- $spec = merge $spec (dict "plugins" $plugins) }}
  {{- end }}
  {{- toYaml $spec | nindent 2 }}
