suite: statefulset tests

release:
  name: some-release

set:
  execution.client: nethermind
  beacon.client: prysm

templates:
  - statefulset.yaml
  - configmap.yaml

tests:
  - it: given explicit affinity then use that affinity and ignore anti affinity presets
    template: statefulset.yaml
    set:
      antiAffinityPreset: hard
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: execution-beacon
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: execution-beacon

  - it: given soft anti affinity preset then use preferred pod anti affinity
    template: statefulset.yaml
    set:
      antiAffinityPreset: soft
      affinity: {}
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: execution-beacon
                        app.kubernetes.io/instance: some-release

  - it: given hard anti affinity preset then use required pod anti affinity
    template: statefulset.yaml
    set:
      antiAffinityPreset: hard
      affinity: {}
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: execution-beacon
                      app.kubernetes.io/instance: some-release

  - it: given no affinity and no preset then affinity is not configured
    template: statefulset.yaml
    set:
      affinity: {}
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: given topology spread constraints without labelSelector then auto-inject pod selector labels
    template: statefulset.yaml
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: execution-beacon
                  app.kubernetes.io/instance: some-release

  - it: given topology spread constraints with explicit labelSelector then use it as-is
    template: statefulset.yaml
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              custom-label: custom-value
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  custom-label: custom-value

  - it: given no topology spread constraints then they are not configured
    template: statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: given a custom execution readiness handler then it replaces the default TCP check
    template: statefulset.yaml
    set:
      execution.readinessProbe.httpGet:
        path: /health
        port: jsonrpc-exec
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "execution")].readinessProbe.tcpSocket
      - equal:
          path: spec.template.spec.containers[?(@.name == "execution")].readinessProbe.httpGet.path
          value: /health

  - it: given execution JSON-RPC is disabled then the execution container has no readiness probe
    template: statefulset.yaml
    set:
      execution.jsonrpc.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "execution")].readinessProbe

  - it: given a custom beacon readiness handler then it replaces the default health check
    template: statefulset.yaml
    set:
      beacon.readinessProbe.tcpSocket:
        port: http-beacon
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "beacon")].readinessProbe.httpGet
      - equal:
          path: spec.template.spec.containers[?(@.name == "beacon")].readinessProbe.tcpSocket.port
          value: http-beacon

  - it: given the beacon REST API is disabled then the beacon container has no readiness probe
    template: statefulset.yaml
    set:
      beacon.restApi.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "beacon")].readinessProbe
