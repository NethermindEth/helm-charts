suite: service account tests

release:
  name: some-release

set:
  nameOverride: some-name

templates:
  - serviceaccount.yaml

tests:
  - it: given no automount value then the API token is not mounted
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: given automount enabled then the API token is mounted
    set:
      serviceAccount:
        automount: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
