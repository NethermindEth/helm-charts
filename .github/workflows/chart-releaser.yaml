name: Helm Charts Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  helm-chart-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.1

      - name: Helm Dependencies
        run: |
          for dir in charts/*/; do
            if [ -f "${dir}Chart.yaml" ]; then
              helm dependency update "$dir"
            fi
          done

      - name: Package Helm Charts
        run: |
          mkdir -p .cr-release-packages
          for dir in charts/*/; do
            if [ -f "${dir}Chart.yaml" ]; then
              helm package "$dir" --destination .cr-release-packages/
            fi
          done

      - name: Run chart-releaser
        if: false # disabled for JFrog identity debug test -- do not merge with this disabled
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: true
          CR_GENERATE_RELEASE_NOTES: true

      - name: Resolve JFrog credential identity (debug)
        env:
          JFROG_USERNAME: ${{ secrets.ARTIFACTORY_ANGKOR_USERNAME }}
          JFROG_TOKEN: ${{ secrets.ARTIFACTORY_ANGKOR_TOKEN_DEVELOPER }}
        run: |
          set -uo pipefail
          echo "Username SHA-256 fingerprint (first 12 chars): $(printf '%s' "$JFROG_USERNAME" | sha256sum | cut -c1-12)"
          echo "Token SHA-256 fingerprint (first 12 chars): $(printf '%s' "$JFROG_TOKEN" | sha256sum | cut -c1-12)"

          IFS='.' read -r HEADER PAYLOAD SIGNATURE <<< "$JFROG_TOKEN"
          if [[ -z "$PAYLOAD" || -z "$SIGNATURE" ]]; then
            echo "Token is not in JWT format (no two '.' separators) -- likely a legacy/opaque Artifactory token; identity cannot be decoded locally."
          else
            MOD=$(( ${#PAYLOAD} % 4 ))
            PADDED="$PAYLOAD"
            if [[ "$MOD" -eq 2 ]]; then PADDED="${PAYLOAD}=="
            elif [[ "$MOD" -eq 3 ]]; then PADDED="${PAYLOAD}="
            fi
            DECODED=$(echo "$PADDED" | tr '_-' '/+' | base64 -d 2>/dev/null || echo "")
            if [[ -z "$DECODED" ]]; then
              echo "Failed to base64-decode JWT payload."
            else
              echo "Decoded JWT claims:"
              echo "$DECODED" | jq .
              echo "token_id (jti) -- compare against the 'Token ID' column in JFrog admin UI: $(echo "$DECODED" | jq -r '.jti // empty')"
              echo "subject (sub): $(echo "$DECODED" | jq -r '.sub // empty')"
            fi
          fi

      - name: Publish to JFrog Artifactory
        if: false # disabled for JFrog identity debug test -- do not merge with this disabled
        shell: bash
        run: |
          helm registry login nethermind.jfrog.io --username ${{ secrets.ARTIFACTORY_ANGKOR_USERNAME }} --password ${{ secrets.ARTIFACTORY_ANGKOR_TOKEN_DEVELOPER }}
          for chart in .cr-release-packages/*.tgz; do
            if [ -f "$chart" ]; then
              helm push "$chart" oci://nethermind.jfrog.io/angkor-helmoci-local
            fi
          done
