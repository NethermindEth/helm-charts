name: Helm Charts Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  helm-chart-release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.1

      - name: Helm Dependencies
        run: |
          for dir in charts/*/; do
            if [ -f "${dir}Chart.yaml" ]; then
              helm dependency update "$dir"
            fi
          done

      - name: Package Helm Charts
        run: |
          mkdir -p .cr-release-packages
          for dir in charts/*/; do
            if [ -f "${dir}Chart.yaml" ]; then
              helm package "$dir" --destination .cr-release-packages/
            fi
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_SKIP_EXISTING: true
          CR_GENERATE_RELEASE_NOTES: true

      - name: Set up JFrog CLI
        id: jfrog
        uses: jfrog/setup-jfrog-cli@1e584506871998c267b7c100c02628a5b9c81db6 # v5.3.0
        env:
          JF_URL: https://nethermind.jfrog.io
        with:
          oidc-provider-name: github-nethermindeth

      - name: Publish to JFrog Artifactory
        shell: bash
        env:
          JF_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JF_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          set -e
          echo "$JF_TOKEN" | helm registry login nethermind.jfrog.io --username "$JF_USER" --password-stdin
          for chart in .cr-release-packages/*.tgz; do
            if [ -f "$chart" ]; then
              helm push "$chart" oci://nethermind.jfrog.io/angkor-helmoci-local
            fi
          done
